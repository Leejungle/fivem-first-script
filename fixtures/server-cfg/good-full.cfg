# Full valid server.cfg
# Demonstrates ACE groups, principals, multiple resources, and optional
# directives. onesync is intentionally NOT set here — it is managed via
# the txAdmin panel on servers that use txAdmin.
# Expected fxpreflight result: zero findings.

# Network binding
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Server identity
sv_hostname "My Community Server"
sv_maxclients 64

# License key — placeholder for fixture use only
sv_licenseKey "PASTE_KEY_HERE_PLACEHOLDER_OK_FOR_FIXTURE"

# Steam Web API key — set a real key for Steam-auth resources
steam_webApiKey "PASTE_STEAM_KEY_HERE"

# Server description (shown in server browser)
sv_projectName "My Community"
sv_projectDesc "A friendly FiveM community server."

# Master server listing
sv_master1 ""

# Voice / VOIP
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

# ----------------------------------------------------------------
# ACE — Access Control Entries
# ----------------------------------------------------------------

# Define the "admin" group and assign a player to it
add_principal identifier.steam:110000112345678 group.admin

# Grant the admin group permission to use the resource management commands
add_ace group.admin command.restart allow
add_ace group.admin command.stop allow
add_ace group.admin command.start allow
add_ace group.admin command.ensure allow

# Grant the admin group permission to kick and ban
add_ace group.admin command.kick allow
add_ace group.admin command.ban allow

# ----------------------------------------------------------------
# Resources
# ----------------------------------------------------------------

# Core FiveM resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager

# Commonly used standalone resources
ensure hardcap
ensure rconlog

# Custom server resources
ensure my-custom-resource
ensure my-jobs-resource
